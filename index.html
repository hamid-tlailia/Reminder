<body class="boot">

<div id="splash" class="splash">
  <svg class="splash__mark" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="sp1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFF6DC"/><stop offset="1" stop-color="#C2923C"/>
      </linearGradient>
    </defs>
    <circle class="splash__track" cx="60" cy="60" r="42" fill="none" stroke="rgba(231,199,126,.18)" stroke-width="3"/>
    <circle class="splash__spin" cx="60" cy="60" r="42" fill="none" stroke="url(#sp1)" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="66 198"/>
    <rect x="42" y="42" width="36" height="36" rx="7" fill="none" stroke="url(#sp1)" stroke-width="2.4"/>
    <rect x="42" y="42" width="36" height="36" rx="7" fill="none" stroke="url(#sp1)" stroke-width="2.4"
          transform="rotate(45 60 60)"/>
    <path d="M60 50 L70 60 L60 70 L50 60 Z" fill="url(#sp1)"/>
  </svg>
  <p class="splash__title">وِردي</p>
  <p class="splash__sub">نجهّز أذكارك…</p>
</div>

<div id="app" hidden></div>
